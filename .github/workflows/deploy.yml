name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # GITHUB_REPOSITORY is always "owner/repo" — strip the owner prefix to get the repo name.
        # If deploying to a custom domain or a user page (user.github.io), set BASE=/ instead.
        run: |
          BASE="/${GITHUB_REPOSITORY#*/}/"
          echo "Building with --base $BASE"
          npm run build -- --base "$BASE"

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
